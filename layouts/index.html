{{ define "main" }}

<article class="post-single">

  <header class="post-header">
    <h1 class="post-title">La charpente</h1>
  </header>

  <div class="post-content">

    <p>Bienvenue dans un roman familial</p>

    <p>
      <img src="{{ "images/HalleAuriac.png" | relURL }}" alt="La charpente de la halle d'Auriac">
    </p>

    <h2>Sommaire</h2>

    <ol>
      {{ range (where site.RegularPages "Section" "livre").ByWeight }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ol>

  </div>

</article>

{{ end }}
